<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MeeLive is a local webcam-driven avatar studio.">
  <meta name="theme-color" content="#f6efe3">
  <title>MeeLive · Avatar studio</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    { "imports": {
      "three": "./vendor/three/build/three.module.min.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    } }
  </script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-library" aria-hidden="true">
    <symbol id="i-brand" viewBox="0 0 24 24"><path d="M3 8V6a3 3 0 0 1 3-3h2m8 0h2a3 3 0 0 1 3 3v2m0 8v2a3 3 0 0 1-3 3h-2m-8 0H6a3 3 0 0 1-3-3v-2"/><path d="M8 10v1m8-1v1m-7 4c1.8 1.8 4.2 1.8 6 0"/></symbol>
    <symbol id="i-fill-window" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3.5M7.5 8 12 3.5 16.5 8M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 .9 6m-1-11v5h5"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 5-3v10l-5-3"/></symbol>
  </svg>

  <div id="studio" class="studio">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./" aria-label="MeeLive home">
          <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-brand"/></svg></span>
          <span>MeeLive</span>
        </a>
        <button class="button button-outline" id="fill-window" type="button" aria-controls="stage" title="Fill this window. Press Esc or double-click the avatar to return." disabled><svg class="icon" aria-hidden="true"><use href="#i-fill-window"/></svg>Fill window</button>
      </div>
    </header>

    <main class="workspace">
      <div class="workspace-grid">
        <div class="preview-column">
          <section class="preview-section" aria-labelledby="preview-title">
            <div class="preview-heading">
              <h1 id="preview-title">avatar preview</h1>
            </div>
            <div class="stage" id="stage">
              <div id="preview-mount" class="preview-mount"></div>
              <div class="stage-reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
              <div class="camera-status" id="camera-status" data-state="off"><span></span><span id="camera-status-text">Camera off</span></div>
              <div id="stage-empty" class="stage-empty">
                <img class="tracking-print" src="./assets/tracking-print.png" width="600" height="420" alt="">
                <div class="empty-copy">
                  <p class="empty-title">no model loaded</p>
                  <button class="button button-primary" id="stage-upload" type="button"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>Load a model</button>
                </div>
              </div>
            </div>
            <div class="preview-actions">
              <div class="framing-field">
                <label class="field-label" for="framing">Framing</label>
                <div class="select-wrap"><select id="framing" disabled><option value="bust">Bust</option><option value="full">Full body</option></select></div>
              </div>
              <button class="button button-quiet" id="set-front" type="button" title="Use the current horizontal viewing angle for tracking" disabled>Set front</button>
              <button class="button button-quiet" id="reset-view" type="button" aria-label="Reset preview" disabled><svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg><span>Reset preview</span></button>
              <button class="button button-outline" id="record" type="button" disabled><span class="record-dot"></span><span id="record-label">Start recording</span></button>
            </div>
            <div class="recording-feedback">
              <p id="record-status" aria-live="polite" hidden></p>
              <a id="download" class="clip-link" hidden>Download clip</a>
            </div>
          </section>
        </div>

        <aside class="sidebar" aria-label="Studio controls">
          <section class="control-section model-section" aria-labelledby="model-title">
            <h2 id="model-title">avatar model</h2>
            <p class="model-import-note">Create an avatar at <a href="https://mii.nxw.pw/" target="_blank" rel="noopener noreferrer">https://mii.nxw.pw/</a> and upload your 3D export here.</p>
            <input type="file" id="model-input" accept=".glb,model/gltf-binary" hidden>
            <button class="dropzone" id="dropzone" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>
              <span><strong id="drop-title">Choose a .glb file</strong><small id="drop-caption">or drop it here</small></span>
            </button>
            <p class="field-note">The last avatar is saved in this browser.</p>
            <button class="button button-quiet" id="forget-avatar" type="button" hidden>Forget saved avatar</button>
            <label class="field-label" for="head-node">Head node</label>
            <div class="select-wrap"><select id="head-node" disabled><option value="">Load a model first</option></select></div>
            <p id="model-status" class="field-note" aria-live="polite" hidden></p>
            <div id="mouth-setup" class="mouth-setup" hidden>
              <button class="button button-outline" id="place-mouth" type="button">Place mouth</button>
              <button class="button button-quiet" id="clear-mouth" type="button" hidden>Clear placement</button>
              <label id="mouth-size-row" class="mouth-size" hidden>Mouth size
                <input id="mouth-size" type="range" min="0.45" max="2.2" step="0.05" value="1">
              </label>
              <p id="mouth-status" class="field-note" aria-live="polite"></p>
            </div>
          </section>

          <section class="control-section" aria-labelledby="tracking-title">
            <h2 id="tracking-title">head tracking</h2>
            <div class="tracking-detail">
              <video id="webcam" autoplay muted playsinline aria-label="Mirrored webcam preview" hidden></video>
              <p id="tracking-status" aria-live="polite">Look straight ahead to calibrate.</p>
            </div>
            <div id="calibration-meter" class="calibration-meter" role="progressbar" aria-label="Neutral pose calibration" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><i></i></div>
            <div class="tracking-actions">
              <button class="button button-primary" id="tracking-toggle" type="button" disabled><svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg><span id="tracking-label">Start tracking</span></button>
              <button class="button button-outline" id="calibrate" type="button" hidden>Recalibrate</button>
            </div>
            <div id="body-option" class="body-option" hidden>
              <label><input id="body-enabled" type="checkbox"> Track upper body</label>
              <p id="body-status" class="field-note" aria-live="polite"></p>
            </div>
          </section>

        </aside>
      </div>

    </main>
  </div>

  <script type="module" src="./bootstrap.js"></script>
</body>
</html>
